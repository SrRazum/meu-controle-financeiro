name: Validar V1.13 de teste

on:
  push:
    branches:
      - revisao-v1.13-filtro-relatorios-clean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código da branch de teste
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validar que a branch de teste permanece independente da main
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')

          required = [
              'V1.13-TESTE',
              'id="reportMonth"',
              'function recoverCloudVault',
              'id="syncRecover"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Validação interrompida. Marcadores ausentes na cópia de teste: ' + ', '.join(missing))

          print('OK: a cópia de teste contém a versão, o filtro de período e a rotina de recuperação.')
          print('OK: nenhuma operação de checkout/cópia da main é executada por este workflow.')

      - name: Validar estrutura mínima do Pages
        shell: bash
        run: |
          test -f index.html
          test -f manifest.json
          test -f config.js
          echo 'OK: arquivos essenciais presentes.'
