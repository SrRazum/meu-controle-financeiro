name: Publicar V1.13 de teste no Pages

on:
  push:
    branches:
      - revisao-v1.13-filtro-relatorios

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v1-13-teste
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da versão de teste
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
