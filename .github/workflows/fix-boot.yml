name: Inspect boot
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          xs=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          Path('debug-scripts.txt').write_text('\n\n===== SCRIPT =====\n'.join(xs),encoding='utf-8')
          print('blocks',len(xs))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-scripts.txt
          git commit -m "Inspect boot scripts" || exit 0
          git push
