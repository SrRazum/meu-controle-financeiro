name: Definitive index boot fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # Local security is the only boot operation.
          s=re.sub(r'initializeSecurity\(\)\.then\(\(\)=>\{const v=document\.getElementById\("appVersion"\);if\(v\)v\.textContent="V1\.14";queueSync\(\)\}\);', 'initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.16";}).catch(err=>{console.error("Falha na inicialização de segurança:",err)});', s, count=1)
          s=re.sub(r'initializeSecurity\(\)\.then\(async\(\)=>\{const v=document\.getElementById\("appVersion"\);if\(v\)v\.textContent="V1\.15";await initCloud\(\);queueSync\(\)\}\)\.catch\(err=>\{console\.error\("Falha na inicialização de segurança:",err\}\);', 'initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.16";}).catch(err=>{console.error("Falha na inicialização de segurança:",err)});', s, count=1)

          # Never execute queueSync; remove the obsolete helper if present.
          s=re.sub(r'function queueSync\(\)\{.*?\}', '', s, count=1, flags=re.S)
          s=s.replace('queueSync()','')

          # Remove automatic cloud-restore helper. Explicit recoverCloudVault remains.
          s=re.sub(r'async function maybeOfferCloudRestore\(\)\{.*?\}', '', s, count=1, flags=re.S)

          # Remove only the legacy Service Worker tail beginning at its actual marker.
          marker='if("serviceWorker"in navigator){'
          i=s.find(marker)
          if i>=0:
              j=s.find('</script>',i)
              if j<0: raise SystemExit('Service Worker script terminator not found')
              s=s[:i]+s[j:]

          # All sync triggers must pass through one gate.
          gate='async function requestSync(manual=false){if(!unlocked)return;if(!__supabase){await initCloud()}if(!__syncReady){if(manual){const msg=document.getElementById("syncMsg");if(msg)msg.textContent="Entre na sua conta para sincronizar."}return}return syncNow(manual)}'
          if 'async function requestSync(manual=false)' not in s:
              needle='async function syncNow(manual=false)'
              if needle not in s: raise SystemExit('syncNow definition not found')
              s=s.replace(needle,gate+';'+needle,1)

          s=s.replace('await syncNow(false)','await requestSync(false)')
          s=s.replace('syncNow(false)','requestSync(false)')
          s=s.replace('syncNow(true)','requestSync(true)')
          s=s.replace('if(!newSession)return;if(unlocked)requestSync(false);else maybeOfferCloudRestore()', 'if(!newSession)return;if(unlocked)requestSync(false)')
          s=s.replace('if(session){if(unlocked)requestSync(false);else maybeOfferCloudRestore()}', 'if(session&&unlocked){await requestSync(false)}')
          s=s.replace('if(!unlocked){const offered=await maybeOfferCloudRestore();msg.textContent=offered?"Conta conectada. Informe a senha de proteção na tela inicial para baixar os lançamentos.":"Conta conectada. Desbloqueie o aplicativo para sincronizar.";refreshSyncUI();if(offered)closeSyncModal();return}', 'if(!unlocked){msg.textContent="Conta conectada. Desbloqueie o aplicativo para sincronizar.";refreshSyncUI();return}')
          s=s.replace('if(data.session){if(unlocked)await requestSync(true);else maybeOfferCloudRestore()}', 'if(data.session&&unlocked){await requestSync(true)}')
          s=re.sub(r'async function save\(\)\{await secureSave\(\);if\(typeof syncNow==="function"\)await requestSync\(false\)\}', 'async function save(){await secureSave();if(unlocked)await requestSync(false)}', s, count=1)

          # Strong invariants: no cloud/SW/queue activity can occur before unlock.
          for token in ['navigator.serviceWorker.register','serviceWorker.addEventListener','queueSync()','maybeOfferCloudRestore()']:
              if token in s: raise SystemExit('Forbidden marker remains: '+token)
          if re.search(r'(?<!function )\bsyncNow\((?:false|true)\)',s): raise SystemExit('Direct syncNow trigger remains outside requestSync')
          if s==original: raise SystemExit('No changes made')
          p.write_text(s,encoding='utf-8')
          print('index.html patched successfully')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S) if x.strip()]
          for i,script in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'inline-{i}.js'
              f.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Inline JavaScript syntax error in block {i}')
          print(f'{len(scripts)} inline JavaScript blocks validated.')
          PY

      - name: Commit patched index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: local-first index boot and single sync gate"
          git push
