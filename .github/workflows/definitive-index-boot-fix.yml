name: Definitive index boot fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known-good index baseline
        shell: bash
        run: |
          git fetch origin 9a77d4abc45b2452fb8b91ede631431e18da5099 --depth=1
          git show 9a77d4abc45b2452fb8b91ede631431e18da5099:index.html > index.html
      - name: Apply definitive local-first boot design
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # One gated sync entry point.
          needle='async function syncNow(manual=false)'
          gate='async function requestSync(manual=false){if(!unlocked)return;if(!__supabase){await initCloud()}if(!__syncReady){if(manual){const msg=document.getElementById("syncMsg");if(msg)msg.textContent="Entre na sua conta para sincronizar."}return}return syncNow(manual)}'
          if 'async function requestSync(manual=false)' not in s:
              if needle not in s: raise SystemExit('syncNow definition not found')
              s=s.replace(needle,gate+needle,1)
          # Route all fixed calls through requestSync.
          s=s.replace('syncNow(false)','requestSync(false)').replace('syncNow(true)','requestSync(true)')
          # Keep the syncNow implementation declaration/calls valid after replacements.
          s=s.replace('async function requestSync(manual=false){if(!unlocked)return;if(!__supabase){await initCloud()}if(!__syncReady){if(manual){const msg=document.getElementById("syncMsg");if(msg)msg.textContent="Entre na sua conta para sincronizar."}return}return requestSync(manual)}',gate)
          # Local save then gated sync.
          s=s.replace('async function save(){await secureSave();if(typeof syncNow==="function")await syncNow(false)}','async function save(){await secureSave();if(unlocked)await requestSync(false)}')
          # Boot must never initialize cloud or queue synchronization.
          s=s.replace('queueSync()','')
          s=s.replace('initCloud();if("serviceWorker"in navigator){','if(unlocked)requestSync(false);if(false){')
          # Remove Service Worker registration code by replacing the whole registration condition with a no-op.
          s=s.replace('if("serviceWorker"in navigator){window.addEventListener("load",async()=>{','if(false){window.addEventListener("load",async()=>{')
          s=s.replace('if("serviceWorker"in navigator){navigator.serviceWorker.addEventListener("controllerchange",()=>location.reload())}','if(false){}')
          # Automatic restore cannot run; keep explicit recoverCloudVault available.
          s=s.replace('maybeOfferCloudRestore()', 'Promise.resolve(false)')
          # Startup remains local-only.
          s=s.replace('initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.14";queueSync()});','initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.16";});')
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S) if x.strip()]
          for i,script in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'inline-{i}.js'; f.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(1)
          print('All inline JavaScript blocks are syntactically valid.')
          PY
      - name: Commit definitive index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: definitive local-first boot and gated synchronization"
          git push
