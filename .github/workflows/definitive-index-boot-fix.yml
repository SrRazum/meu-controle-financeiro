name: Definitive index boot fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restore last known-good index baseline
        run: |
          git fetch origin 9a77d4abc45b2452fb8b91ede631431e18da5099 --depth=1
          git show 9a77d4abc45b2452fb8b91ede631431e18da5099:index.html > index.html
      - name: Apply definitive local-first boot fix
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # Single gate, installed before callers are rewritten.
          needle='async function syncNow(manual=false)'
          gate='async function requestSync(manual=false){if(!unlocked)return;if(!__supabase){await initCloud()}if(!__syncReady){if(manual){const msg=document.getElementById("syncMsg");if(msg)msg.textContent="Entre na sua conta para sincronizar."}return}return syncNow(manual)}'
          if 'async function requestSync(manual=false)' not in s:
              if needle not in s: raise SystemExit('syncNow definition not found')
              s=s.replace(needle,gate+needle,1)
          old_queue='function queueSync(){if(typeof syncNow!=="function")return;Promise.resolve().then(()=>syncNow(false)).catch(()=>{})}'
          if old_queue in s: s=s.replace(old_queue,gate,1)
          # Remove only calls, never the function syntax.
          s=s.replace('queueSync()','')
          # Route fixed sync calls.
          s=s.replace('await syncNow(false)','await requestSync(false)').replace('syncNow(false)','requestSync(false)').replace('syncNow(true)','requestSync(true)')
          # Keep gate correct after caller replacement.
          s=s.replace('async function requestSync(manual=false){if(!unlocked)return;if(!__supabase){await initCloud()}if(!__syncReady){if(manual){const msg=document.getElementById("syncMsg");if(msg)msg.textContent="Entre na sua conta para sincronizar."}return}return requestSync(manual)}',gate)
          # No automatic cloud restore before unlock.
          s=s.replace('async function maybeOfferCloudRestore()', 'async function legacyCloudRestoreDisabled()',1)
          s=s.replace('maybeOfferCloudRestore()', 'Promise.resolve(false)').replace('else Promise.resolve(false)','else {}')
          # Boot no longer calls initCloud; it only installs a post-unlock online trigger.
          s=s.replace('initCloud();if("serviceWorker"in navigator){','window.addEventListener("online",()=>{if(unlocked)requestSync(false)});if("serviceWorker"in navigator){',1)
          # Disable registration block without deleting its braces: change the condition and make register a harmless resolved promise.
          s=s.replace('if("serviceWorker"in navigator){window.addEventListener("load",async()=>{','if(false){window.addEventListener("load",async()=>{',1)
          s=s.replace('navigator.serviceWorker.register("sw.js")','Promise.resolve(null)',1)
          s=s.replace('if("serviceWorker"in navigator){navigator.serviceWorker.addEventListener("controllerchange",()=>location.reload())}','if(false){}',1)
          # Local persistence remains authoritative.
          s=s.replace('async function save(){await secureSave();if(typeof syncNow==="function")await requestSync(false)}','async function save(){await secureSave();if(unlocked)await requestSync(false)}')
          p.write_text(s,encoding='utf-8')
      - name: Validate final JavaScript and invariants
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S) if x.strip()]
          for i,script in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'inline-{i}.js'; f.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit(1)
          assert 'navigator.serviceWorker.register' not in html
          assert 'queueSync()' not in html
          assert 'maybeOfferCloudRestore()' not in html
          assert 'async function requestSync(manual=false)' in html
          assert not re.search(r'(?<!function )\bsyncNow\((?:false|true)\)',html)
          print('FINAL VALIDATION PASSED')
          PY
      - name: Commit definitive index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: definitive local-first boot and gated synchronization"
          git push
