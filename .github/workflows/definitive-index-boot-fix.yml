name: Definitive index boot fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check historical index baselines
        shell: bash
        run: |
          for c in 2134e5538686e5c4ae87fcd21c25e747c3f2d3d1 9a77d4abc45b2452fb8b91ede631431e18da5099 38bf610206e4e106cee662fe01fc67a635ae9ab2; do
            git show "$c:index.html" > /tmp/index-$c.html
            python - "$c" <<'PY'
          import re,subprocess,sys,tempfile
          from pathlib import Path
          c=sys.argv[1]; html=Path(f'/tmp/index-{c}.html').read_text(encoding='utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S) if x.strip()]
          ok=True
          for i,script in enumerate(scripts,1):
            f=Path(tempfile.gettempdir())/f'{c}-{i}.js';f.write_text(script,encoding='utf-8');r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode: print(c,'BLOCK',i,r.stderr);ok=False
          print(c,'VALID' if ok else 'INVALID', 'blocks',len(scripts))
          PY
          done
