name: Definitive index boot fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); original=s

          # Local protection only during boot; no queueSync from initialization.
          s=s.replace('queueSync()','')
          s=s.replace('initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.14";});','initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.16";}).catch(err=>{console.error("Falha na inicialização de segurança:",err)});',1)
          s=s.replace('initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.15";await initCloud();}).catch(err=>{console.error("Falha na inicialização de segurança:",err)});','initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.16";}).catch(err=>{console.error("Falha na inicialização de segurança:",err)});',1)

          # Add the only synchronization entry point before syncNow.
          if 'async function requestSync(manual=false)' not in s:
              needle='async function syncNow(manual=false)'
              gate='async function requestSync(manual=false){if(!unlocked)return;if(!__supabase){await initCloud()}if(!__syncReady){if(manual){const msg=document.getElementById("syncMsg");if(msg)msg.textContent="Entre na sua conta para sincronizar."}return}return syncNow(manual)};'
              if needle not in s: raise SystemExit('syncNow definition not found')
              s=s.replace(needle,gate+needle,1)

          # Replace all fixed sync calls with the single gate.
          s=s.replace('await syncNow(false)','await requestSync(false)').replace('syncNow(false)','requestSync(false)').replace('syncNow(true)','requestSync(true)')

          # Automatic cloud restore is disabled: helper is renamed and all old callers become no-ops.
          s=s.replace('async function maybeOfferCloudRestore()', 'async function legacyCloudRestoreDisabled()',1)
          s=s.replace('maybeOfferCloudRestore()', 'Promise.resolve(false)')
          s=s.replace('else Promise.resolve(false)', 'else {}')

          # The old boot tail must not initialize cloud or register a Service Worker.
          marker='initCloud();if("serviceWorker"in navigator){'
          if marker in s:
              a=s.find(marker); b=s.find('</script>',a)
              if b<0: raise SystemExit('script end not found')
              s=s[:a]+'window.addEventListener("online",()=>{if(unlocked)requestSync(false)});'+s[b:]
          # Remove the registration block by stable boundaries, retaining its UI helper only if desired.
          a=s.find('if("serviceWorker"in navigator){window.addEventListener("load",async()=>{')
          if a>=0:
              b=s.find('function showUpdateNotice',a)
              if b<0: raise SystemExit('showUpdateNotice boundary not found')
              s=s[:a]+s[b:]
          # Disable the remaining controller-change listener completely.
          s=s.replace('if("serviceWorker"in navigator){navigator.serviceWorker.addEventListener("controllerchange",()=>location.reload())}','')

          # Strong invariants.
          for token in ['navigator.serviceWorker.register','navigator.serviceWorker.addEventListener','queueSync()','maybeOfferCloudRestore()']:
              if token in s: raise SystemExit('Forbidden marker remains: '+token)
          if re.search(r'(?<!function )\bsyncNow\((?:false|true)\)',s): raise SystemExit('Direct syncNow(false/true) remains')
          if 'async function requestSync(manual=false)' not in s: raise SystemExit('requestSync missing')
          if s==original: raise SystemExit('No changes made')
          p.write_text(s,encoding='utf-8')
          print('index.html patched')

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S) if x.strip()]
          for i,script in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'inline-{i}.js'; f.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(f'Inline JavaScript syntax error in block {i}')
          print(f'{len(scripts)} inline JavaScript blocks validated.')
          PY

      - name: Commit patched index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: definitive local-first boot and gated sync"
          git push
