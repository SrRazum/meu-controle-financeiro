name: Repair and stabilize application boot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply definitive boot and sync fix
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          original = s

          # Repair the malformed notification separator.
          s = re.sub(r'join\("\\\n"\)', 'join("\\\\n")', s)
          s = re.sub(r"join\('\\\n'\)", "join('\\\\n')", s)
          s = s.replace('join("\n")', 'join("\\n")')
          s = s.replace("join('\n')", "join('\\n')")

          # Prevent the cloud initializer from racing the security initializer.
          old_boot = 'initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.14";queueSync()});'
          new_boot = 'initializeSecurity().then(async()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.15";await initCloud();queueSync()}).catch(err=>{console.error("Falha na inicialização de segurança:",err)});'
          if old_boot in s:
              s = s.replace(old_boot, new_boot, 1)
          elif 'initializeSecurity().then(async()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.15";await initCloud();queueSync()}' not in s:
              raise SystemExit("Security bootstrap marker not found; refusing unsafe edit")

          # Remove the old independent cloud initializer and all legacy SW code.
          marker = 'initCloud();if("serviceWorker"in navigator){'
          if marker in s:
              head, _, tail = s.partition(marker)
              closing = tail.find('</script>')
              if closing < 0:
                  raise SystemExit("Could not locate script closing tag")
              s = head + '</script>' + tail[closing + len('</script>'):]

          p.write_text(s, encoding="utf-8")
          print("Definitive boot fix applied.")

      - name: Validate JavaScript and commit only a valid build
        shell: python
        run: |
          import re, subprocess, tempfile
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = [x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S) if x.strip()]
          for i, script in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / f"inline-{i}.js"
              f.write_text(script, encoding="utf-8")
              r = subprocess.run(["node", "--check", str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(f"SCRIPT {i} failed. Last 15 lines:")
                  lines = script.splitlines()
                  for n, line in enumerate(lines[-15:], max(1, len(lines)-14)):
                      print(f"{n}: {line}")
                  # Find whether removing one source line restores syntax.
                  candidates=[]
                  for idx in range(len(lines)):
                      test='\n'.join(lines[:idx]+lines[idx+1:])
                      tf=Path(tempfile.gettempdir())/f"test-{i}.js"
                      tf.write_text(test, encoding="utf-8")
                      rr=subprocess.run(["node","--check",str(tf)],capture_output=True,text=True)
                      if rr.returncode==0:
                          candidates.append(idx+1)
                  print("Single-line removal candidates:", candidates)
                  print(r.stderr)
                  raise SystemExit(f"Inline JavaScript syntax error in script #{i}")
          print("All inline JavaScript blocks pass node --check.")

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add index.html
            git commit -m "Fix startup parser error and boot race"
            git push
          fi
