name: Repair and stabilize application boot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite damaged startup block
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          pattern = r'function updateCats\(\).*?document\.getElementById\("data"\)\.value=today\(\);'
          replacement = '''function updateCats(){
          const el=document.getElementById("categoria");
          const tipoEl=document.getElementById("tipo");
          if(!el||!tipoEl)return;
          const old=el.value;
          el.innerHTML=(cats[tipoEl.value]||[]).map(x=>`<option>${x}</option>`).join("");
          if((cats[tipoEl.value]||[]).includes(old))el.value=old;
          }
          function updateStatusOptions(){
          const s=document.getElementById("status");
          const tipoEl=document.getElementById("tipo");
          if(!s||!tipoEl)return;
          const old=s.value;
          const entrada=tipoEl.value==="entrada";
          s.innerHTML=entrada?'<option value="pago">Recebido</option><option value="pendente">Pendente</option>':'<option value="pago">Pago</option><option value="pendente">Pendente</option>';
          s.value=old==="pendente"?"pendente":"pago";
          }
          const tipoEl=document.getElementById("tipo");
          if(tipoEl)tipoEl.addEventListener("change",()=>{updateCats();updateStatusOptions()});
          updateCats();
          updateStatusOptions();
          document.getElementById("data").value=today();'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit("Damaged category/status startup block not found; refusing unsafe edit")
          s=s2

          s=re.sub(r'join\("\\\n"\)', 'join("\\\\n")', s)
          s=re.sub(r"join\('\\\n'\)", "join('\\\\n')", s)

          old_boot='initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.14";queueSync()});'
          new_boot='window.addEventListener("load",async()=>{try{await initializeSecurity();const v=document.getElementById("appVersion");if(v)v.textContent="V1.15";if(typeof initCloud==="function")await initCloud();if(unlocked)await syncNow(false);else await maybeOfferCloudRestore()}catch(err){console.error("Falha na inicialização do aplicativo:",err)}});'
          if old_boot in s:
              s=s.replace(old_boot,new_boot,1)
          elif 'window.addEventListener("load",async()=>{try{await initializeSecurity();const v=document.getElementById("appVersion");if(v)v.textContent="V1.15";' not in s:
              raise SystemExit("Security bootstrap marker not found; refusing unsafe edit")

          marker='initCloud();if("serviceWorker"in navigator){'
          if marker in s:
              head,_,tail=s.partition(marker)
              closing=tail.find('</script>')
              if closing<0: raise SystemExit("Script closing tag not found")
              s=head+'</script>'+tail[closing+len('</script>'):]

          p.write_text(s,encoding="utf-8")
          print("Definitive boot fix applied.")

      - name: Validate inline JavaScript syntax
        shell: python
        run: |
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=[x for x in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S) if x.strip()]
          for i,script in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f"inline-{i}.js"
              f.write_text(script,encoding="utf-8")
              r=subprocess.run(["node","--check",str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f"Inline JavaScript syntax error in script #{i}")
          print("All inline JavaScript blocks pass node --check.")

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add index.html
            git commit -m "Fix startup sequencing and disable stale service worker"
            git push
          fi
