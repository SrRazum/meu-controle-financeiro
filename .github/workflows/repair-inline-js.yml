name: Repair inline JavaScript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair malformed JavaScript literals
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          original = s
          # Repair the known broken literal join("<real newline>") -> join("\\n").
          s = s.replace('join("\n")', 'join("\\n")')
          # Also repair the same corruption when it appears with single quotes.
          s = s.replace("join('\n')", "join('\\n')")
          if s == original:
              print("No malformed newline literal found.")
          else:
              p.write_text(s, encoding="utf-8")
              print("Repaired malformed JavaScript string literal.")

      - name: Validate inline JavaScript syntax
        shell: python
        run: |
          import re, subprocess, tempfile
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit("No inline scripts found")
          for i, script in enumerate(scripts, 1):
              if not script.strip():
                  continue
              f = Path(tempfile.gettempdir()) / f"inline-{i}.js"
              f.write_text(script, encoding="utf-8")
              r = subprocess.run(["node", "--check", str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stdout)
                  print(r.stderr)
                  raise SystemExit(f"Inline JavaScript syntax error in script #{i}")
          print("All inline JavaScript blocks pass node --check.")

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add index.html
            git commit -m "Fix inline JavaScript syntax and validate startup"
            git push
          fi
