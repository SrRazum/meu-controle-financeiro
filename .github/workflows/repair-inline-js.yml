name: Repair and stabilize application boot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good index and disable boot race
        shell: bash
        run: |
          git checkout b91e2488c5a842dede704659cd1165b027c7abc6 -- index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Keep the known-good application UI/data logic, but prevent cloud
          # initialization from racing the local security initialization.
          s=s.replace('initCloud();if("serviceWorker"in navigator){','if("serviceWorker"in navigator){')
          # Remove page-side registration of the obsolete service worker.
          marker='if("serviceWorker"in navigator){window.addEventListener("load",async()=>{try{const registration=await navigator.serviceWorker.register("./sw.js"'
          m=s.find(marker)
          if m>=0:
              close=s.find('</script>',m)
              if close<0: raise SystemExit('Service-worker block is incomplete')
              s=s[:m]+s[close:]
          # Start security and cloud only after all scripts are available.
          old='initializeSecurity().then(()=>{const v=document.getElementById("appVersion");if(v)v.textContent="V1.12";queueSync()});'
          if old in s:
              new='window.addEventListener("load",async()=>{try{await initializeSecurity();const v=document.getElementById("appVersion");if(v)v.textContent="V1.15";if(typeof initCloud==="function")await initCloud();if(unlocked)await syncNow(false);else await maybeOfferCloudRestore()}catch(err){console.error("Falha na inicialização do aplicativo:",err)}});'
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          if not scripts: raise SystemExit('No inline scripts found')
          for i,script in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'inline-{i}.js'
              f.write_text(script,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'Inline JavaScript syntax error in script #{i}')
          print(f'All {len(scripts)} inline JavaScript blocks pass node --check.')
          PY

      - name: Commit repaired application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add index.html
            git commit -m "Restore stable application boot and preserve data"
            git push
          fi
