name: Apply V1.12 fixes
on:
  push:
    branches: [v1.12-fix-work]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python apply_v112_fixes.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: apply validated V1.12 protection and sync corrections' || exit 0
          git push
