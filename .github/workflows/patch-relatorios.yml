name: Preparar filtro de periodo

on:
  push:
    branches:
      - revisao-v1.13-filtro-relatorios-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar filtro de periodo nos relatorios
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_section = '''<section id="relatorios" class="view">
          <div class="card">
          <h2>📊 Relatórios</h2>
          <div class="filter">
          <label style="min-width:150px">Período<input id="reportMonth" type="month"></label>
          </div>
          <div class="small">Os valores abaixo consideram somente lançamentos cuja data pertence ao período selecionado.</div>
          </div>
          <div class="grid" id="reportCards"></div>
          <div class="section card"><h2>📊 Resumo por categoria</h2><div class="table-wrap"><table><thead><tr><th>Categoria</th><th>Entradas</th><th>Saídas</th></tr></thead><tbody id="catBody"></tbody></table></div></div>
          </section>'''

          new_section = '''<section id="relatorios" class="view">
          <div class="card">
          <h2>📊 Relatórios</h2>
          <div class="filter">
          <label style="min-width:150px">Período<select id="reportMonth"><option value="">Todos os períodos</option></select></label>
          </div>
          <div class="small" id="reportPeriodHelp">Os valores abaixo consideram todos os lançamentos registrados.</div>
          </div>
          <div class="grid" id="reportCards"></div>
          <div class="section card"><h2>📊 Resumo por categoria</h2><div class="table-wrap"><table><thead><tr><th>Categoria</th><th>Entradas</th><th>Saídas</th></tr></thead><tbody id="catBody"></tbody></table></div></div>
          </section>'''

          if old_section not in s:
              raise SystemExit('Secao de relatorios nao encontrada; nenhuma alteracao feita.')
          s = s.replace(old_section, new_section, 1)

          old = ''' let reportMonthEl=document.getElementById("reportMonth");
 if(reportMonthEl && !reportMonthEl.value)reportMonthEl.value=month;
 let reportPeriod=reportMonthEl?.value||month;
 let m=activeData().filter(x=>x.data.startsWith(reportPeriod)), en=m.filter(x=>x.tipo==="entrada").reduce((s,x)=>s+x.valor,0), sa=m.filter(x=>x.tipo==="saida").reduce((s,x)=>s+x.valor,0);
 let pendingPeriod=m.filter(x=>x.status==="pendente").reduce((s,x)=>s+x.valor,0);
 reportCards.innerHTML=[["Entradas",en,"green"],["Saídas",sa,"red"],["Resultado",en-sa,en-sa>=0?"green":"red"],["Contas pendentes",pendingPeriod,"orange"]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${x[2]}">${brl(x[1])}</div></div>`).join("");
 let map={};m.forEach(x=>{map[x.categoria]??={e:0,s:0};map[x.categoria][x.tipo==="entrada"?"e":"s"]+=x.valor});catBody.innerHTML=Object.entries(map).map(([k,v])=>`<tr><td>${k}</td><td class="green">${brl(v.e)}</td><td class="red">${brl(v.s)}</td></tr>`).join("")||'<tr><td colspan="3" class="empty">Sem dados no período selecionado.</td></tr>';
 if(reportMonthEl)reportMonthEl.onchange=render;'''

          new = ''' let reportMonthEl=document.getElementById("reportMonth");
 let reportPeriod=reportMonthEl?.value||"";
 if(reportMonthEl){
   const selected=reportPeriod;
   const months=[...new Set(activeData().map(x=>x.data?.slice(0,7)).filter(Boolean))].sort().reverse();
   reportMonthEl.innerHTML='<option value="">Todos os períodos</option>'+months.map(v=>{const [y,mo]=v.split("-");const label=new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric"}).format(new Date(Number(y),Number(mo)-1,1));return `<option value="${v}">${label}</option>`}).join("");
   reportMonthEl.value=months.includes(selected)?selected:"";
   reportMonthEl.onchange=render;
   const help=document.getElementById("reportPeriodHelp");
   if(help)help.textContent=reportMonthEl.value?"Os valores abaixo consideram somente lançamentos cuja data pertence ao mês selecionado.":"Os valores abaixo consideram todos os lançamentos registrados.";
   reportPeriod=reportMonthEl.value;
 }
 let m=reportPeriod?activeData().filter(x=>x.data.startsWith(reportPeriod)):activeData();
 let en=m.filter(x=>x.tipo==="entrada").reduce((s,x)=>s+x.valor,0), sa=m.filter(x=>x.tipo==="saida").reduce((s,x)=>s+x.valor,0);
 let pendingPeriod=m.filter(x=>x.status==="pendente").reduce((s,x)=>s+x.valor,0);
 reportCards.innerHTML=[["Entradas",en,"green"],["Saídas",sa,"red"],["Resultado",en-sa,en-sa>=0?"green":"red"],["Contas pendentes",pendingPeriod,"orange"]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${x[2]}">${brl(x[1])}</div></div>`).join("");
 let map={};m.forEach(x=>{map[x.categoria]??={e:0,s:0};map[x.categoria][x.tipo==="entrada"?"e":"s"]+=x.valor});catBody.innerHTML=Object.entries(map).map(([k,v])=>`<tr><td>${k}</td><td class="green">${brl(v.e)}</td><td class="red">${brl(v.s)}</td></tr>`).join("")||'<tr><td colspan="3" class="empty">Sem dados no período selecionado.</td></tr>';'''

          if old not in s:
              raise SystemExit('Bloco de calculo dos relatorios nao encontrado; nenhuma alteracao feita.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: permitir todos os periodos nos relatorios'
          git push