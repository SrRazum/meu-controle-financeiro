<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atualizando Meu Controle Financeiro</title>
<style>body{font-family:Arial,sans-serif;background:#f8f1e8;color:#4a211d;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.box{background:#fff;border:1px solid #ead9ca;border-radius:16px;padding:28px;max-width:520px;text-align:center;box-shadow:0 12px 40px #0001}h2{margin-top:0}.msg{color:#76685f;line-height:1.5}</style>
</head>
<body>
<div class="box"><h2>Atualizando o aplicativo…</h2><div class="msg" id="msg">Removendo componentes antigos e preparando uma inicialização limpa.</div></div>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k).catch(()=>false)));
    }
    msg.textContent='Limpeza concluída. Carregando a versão atual…';
  }catch(e){
    msg.textContent='A limpeza foi concluída parcialmente. Carregando a versão atual…';
  }
  const target='./?cleanboot='+Date.now();
  setTimeout(()=>location.replace(target),300);
})();
</script>
</body>
</html>
